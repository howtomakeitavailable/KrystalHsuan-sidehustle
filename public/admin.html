<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>工作室後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<!-- 登入 -->
<div class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <span class="brand-mark" aria-hidden="true">書</span>
    <h1>工作室後台</h1>
    <label class="field">密碼
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary">登入</button>
    <a href="./" class="login-back">回到網站</a>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="sidebar">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">書</span>
      <span class="brand-text"><strong id="brand-name">書頁工作室</strong><small>後台</small></span>
    </a>
    <nav class="nav" aria-label="後台頁面">
      <a href="#inbox" data-view="inbox"><span>委託收件匣 <b class="count" id="nav-new"></b></span><small>案主送出的委託</small></a>
      <a href="#projects" data-view="projects"><span>檔期管理</span><small>行事曆上的工作區塊</small></a>
      <a href="./#schedule"><span>查看公開行事曆</span><small>案主看到的樣子</small></a>
    </nav>
    <button type="button" class="btn logout" id="logout">登出</button>
  </aside>

  <main class="main">
    <section class="view" data-view="inbox" hidden>
      <header class="view-head">
        <p class="eyebrow">委託收件匣</p>
        <h1>誰在等你回覆</h1>
      </header>
      <div class="sched-summary" id="inbox-stats"></div>
      <div class="filters" id="inbox-filters" role="group" aria-label="依狀態篩選"></div>
      <div class="req-list" id="req-list"></div>
    </section>

    <section class="view" data-view="projects" hidden>
      <header class="view-head">
        <p class="eyebrow">檔期管理</p>
        <h1>手上的案子</h1>
        <p class="lede">這裡的代稱、服務、工作內容和日期會公開在網站行事曆上；真實案主名稱和私人備註只有你看得到。</p>
      </header>
      <div><button type="button" class="btn btn-primary" id="add-project">新增檔期</button></div>
      <div class="proj-groups" id="proj-groups"></div>
    </section>
  </main>
</div>

<!-- 檔期編輯 -->
<dialog class="editor" id="editor">
  <form id="editor-form" method="dialog">
    <h2 id="editor-title">新增檔期</h2>
    <p class="editor-from" id="editor-from" hidden></p>
    <div class="row2">
      <label class="field">代稱 <small>公開顯示，例如「案主A」</small>
        <input type="text" id="e-alias" required maxlength="40">
      </label>
      <label class="field">服務
        <select id="e-service"></select>
      </label>
    </div>
    <label class="field">工作內容 <small>公開顯示，不要寫書名或作者名</small>
      <input type="text" id="e-title" maxlength="120" placeholder="例如：心理學譯著 二校">
    </label>
    <div class="row2">
      <label class="field">開工日 <input type="date" id="e-start" required></label>
      <label class="field">截稿日 <input type="date" id="e-end" required></label>
    </div>
    <div class="row2">
      <label class="choice"><input type="checkbox" id="e-tentative"><span><b>洽談中</b><small>虛線顯示，不佔檔期</small></span></label>
      <label class="choice"><input type="checkbox" id="e-hidden"><span><b>不公開</b><small>不出現在網站行事曆</small></span></label>
    </div>
    <div class="private">
      <p class="private-label">只有你看得到</p>
      <label class="field">真實案主名稱 <input type="text" id="e-client" maxlength="100"></label>
      <label class="field">私人備註 <textarea id="e-note" rows="3" maxlength="2000" placeholder="例如：報價 NT$31,500、訂金已收"></textarea></label>
    </div>
    <p class="form-error" id="editor-error" role="alert" hidden></p>
    <div class="editor-actions">
      <button type="button" class="btn" id="editor-cancel">取消</button>
      <button type="submit" class="btn btn-primary" id="editor-save">儲存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
